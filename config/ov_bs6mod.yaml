name: Vampire Night overlay bs6mod
options:
  basename: bs6mod
  target_path: disc/TBL/BS6MOD.BIN
  base_path: ..
  platform: ps2
  compiler: MWCCPS2
  asm_path: asm/bs6mod
  src_path: src/bs6mod
  build_path: build
  symbol_addrs_path: config/ov_bs6mod_syms.txt
  ld_script_path: build/bs6mod.ld
  find_file_boundaries: False
segments:
  - [0x0, bin, header]  
  - name: bs6mod
    type: code
    start: 0x80
    vram: 0x9C4880
    subsegments:
      - [0x80, asm, bs6mod_text]
      - [0xE5C0, data, bs6mod_data]
  - [0x12000]
