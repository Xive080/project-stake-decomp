name: Vampire Night overlay bs2mod
options:
  basename: bs2mod
  target_path: disc/TBL/BS2MOD.BIN
  base_path: ..
  platform: ps2
  compiler: MWCCPS2
  asm_path: asm/bs2mod
  src_path: src/bs2mod
  build_path: build
  symbol_addrs_path: config/ov_bs2mod_syms.txt
  ld_script_path: build/bs2mod.ld
  find_file_boundaries: False
segments:
  - [0x0, bin, header]  
  - name: bs2mod
    type: code
    start: 0x80
    vram: 0x9C4880
    subsegments:
      - [0x80, asm, bs2mod_text]
      - [0x10240, data, bs2mod_data]
  - [0x13000]
